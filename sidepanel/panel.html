<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setup Copilot</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main id="panel-root">
      <header class="panel-header">
        <span class="panel-eyebrow">SETUP COPILOT</span>
        <h1 class="panel-title">설정 도우미</h1>
      </header>

      <section id="state-slot" class="state-slot" aria-live="polite"></section>
    </main>

    <!-- 공급자 미등록 -->
    <template id="tpl-no-provider">
      <div class="card">
        <p class="card-lede">AI 공급자를 등록해야 시작할 수 있습니다.</p>
        <div class="card-actions">
          <button type="button" class="btn-primary" data-action="open-options">공급자 설정 열기</button>
        </div>
      </div>
    </template>

    <!-- 메인 입력창 -->
    <template id="tpl-prompt">
      <div class="card">
        <!-- URL 기반 추천 (기본 hidden) -->
        <div data-slot="url-rec" hidden>
          <p class="section-label">현재 페이지에 맞는 설정</p>
          <div class="recipe-rec">
            <span class="rec-name" data-slot="rec-name"></span>
            <button type="button" class="btn-primary btn-sm" data-action="start-rec">시작</button>
          </div>
        </div>
        <!-- 이어하기 (기본 hidden) -->
        <div data-slot="resume-section" hidden>
          <p class="section-label">이전 설정</p>
          <div class="recipe-rec">
            <span class="rec-name" data-slot="resume-name"></span>
            <button type="button" class="btn-ghost btn-sm" data-action="resume-rec">이어하기</button>
          </div>
        </div>
        <!-- 자연어 입력 -->
        <form class="prompt-form" data-slot="form">
          <input
            type="text"
            class="prompt-input"
            data-slot="input"
            placeholder="예: 스킨 바꾸고 싶어"
            autocomplete="off"
            maxlength="200"
          />
          <button type="submit" class="btn-primary">보내기</button>
        </form>
        <!-- 최근 사용 (기본 hidden) -->
        <div data-slot="recent-section" hidden>
          <p class="section-label">최근 사용</p>
          <div class="recent-chips" data-slot="recent-chips"></div>
        </div>
        <!-- 레시피 진입 -->
        <button type="button" class="recipe-entry-btn btn-ghost" data-action="open-recipe-pick">레시피로 설정하기 →</button>
      </div>
    </template>

    <!-- Recipe 선택 목록 -->
    <template id="tpl-recipe-pick">
      <div class="card">
        <div class="recipe-pick-head">
          <button type="button" class="btn-ghost btn-sm" data-action="back">← 돌아가기</button>
          <p class="section-label">레시피 선택</p>
        </div>
        <div class="recipe-chips" data-slot="chips"></div>
      </div>
    </template>

    <!-- 팝업 일시정지 -->
    <template id="tpl-paused">
      <div class="card">
        <p class="card-lede">인증 창에서 연결을 완료해 주세요.</p>
        <p class="card-note">창이 닫히면 자동으로 다음 단계로 진행합니다.</p>
        <div class="card-actions">
          <button type="button" class="btn-primary" data-action="popup-continue">계속하기</button>
          <button type="button" class="btn-ghost" data-action="popup-cancel">취소</button>
        </div>
      </div>
    </template>

    <!-- 처리 중 -->
    <template id="tpl-resolving">
      <div class="card resolving">
        <span class="spinner" aria-label="처리 중"></span>
      </div>
    </template>

    <!-- 진입 -->
    <template id="tpl-entry">
      <div class="card">
        <p class="card-lede" data-slot="lede">먼저 설정 화면으로 이동해야 합니다.</p>
        <p class="card-note mono" data-slot="note"></p>
        <div class="card-actions">
          <button type="button" class="btn-primary" data-action="go-entry" data-slot="go-btn">열기</button>
          <button type="button" class="btn-ghost" data-action="cancel">취소</button>
        </div>
      </div>
    </template>

    <!-- 실행 중 -->
    <template id="tpl-running">
      <div class="run-layout">
        <ol class="step-rail" data-slot="rail"></ol>
        <div class="run-main">
          <div class="goal-progress" data-slot="goal-progress" hidden>
            <span class="goal-progress-text" data-slot="goal-progress-text"></span>
          </div>
          <!-- 클립보드 페이로드 복사 (payload 있는 goal 에서만 표시) -->
          <div class="payload-copy-section" data-slot="payload-copy" hidden>
            <button type="button" class="btn-ghost btn-sm payload-copy-btn" data-action="copy-payload"></button>
            <div class="payload-fallback" data-slot="payload-fallback" hidden>
              <p class="payload-fallback-note">클립보드 접근이 거부됐습니다. 아래를 직접 복사하세요.</p>
              <textarea readonly class="payload-text" data-slot="payload-text"></textarea>
            </div>
          </div>
          <div class="proc-head">
            <span class="proc-index" data-slot="proc-index"></span>
            <h3 class="proc-title" data-slot="proc-title"></h3>
            <span class="trust-badge" data-slot="trust-badge" hidden></span>
          </div>
          <div class="step-card">
            <p class="step-instruct" data-slot="instruct"></p>
            <p class="step-hint" data-slot="hint" hidden></p>
            <div class="step-actions">
              <button type="button" class="btn-ghost" data-action="locate" data-slot="locate-btn">위치 보기</button>
              <button type="button" class="btn-ghost" data-action="fail">안 돼요</button>
              <button type="button" class="btn-ghost" data-action="reinterpret">화면이 달라요</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 막힘 -->
    <template id="tpl-blocked">
      <div class="run-layout">
        <ol class="step-rail" data-slot="rail"></ol>
        <div class="run-main">
          <div class="proc-head">
            <span class="proc-index" data-slot="proc-index"></span>
            <h3 class="proc-title" data-slot="proc-title"></h3>
          </div>
          <div class="step-card blocked">
            <p class="step-instruct" data-slot="instruct"></p>
            <p class="step-recover" data-slot="recover">
              이 단계에서 두 번 막혔습니다. 수동으로 진행하거나 처음부터 다시 시작하세요.
            </p>
            <div class="step-actions">
              <button type="button" class="btn-ghost" data-action="manual">수동으로 진행</button>
              <button type="button" class="btn-ghost" data-action="restart">처음부터</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 완료 -->
    <template id="tpl-done">
      <div class="card">
        <p class="card-lede">모든 절차를 완료했습니다.</p>
        <p class="card-lede done-goal" data-slot="goal-label"></p>
        <div class="card-actions">
          <button type="button" class="btn-primary" data-action="restart">다른 설정 하기</button>
        </div>
      </div>
    </template>

    <!-- Recipe 완료 -->
    <template id="tpl-recipe-done">
      <div class="card">
        <p class="card-lede">모든 설정을 완료했습니다.</p>
        <p class="card-lede done-goal" data-slot="goal-label"></p>
        <div class="card-actions">
          <button type="button" class="btn-primary" data-action="restart">다른 설정 하기</button>
        </div>
      </div>
    </template>

    <!-- 거절 -->
    <template id="tpl-refuse">
      <div class="card">
        <p class="card-lede" data-slot="lede"></p>
        <div class="card-actions">
          <button type="button" class="btn-primary" data-action="retry">다시 입력</button>
        </div>
      </div>
    </template>

    <script type="module" src="panel.js"></script>
  </body>
</html>
